<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seja um Apoiador - Nossa ONG</title>
  <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>

  <header>
    <h1>Nossa ONG</h1>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html">Seja um Apoiador</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="formulario-cadastro">
      <h2>Formulário de Registro de Apoiadores</h2>
      <p>Preencha os campos abaixo com atenção para efetuar o seu cadastro de forma segura.</p>

      <form action="#" method="POST">
        
        <!-- Agrupamento Lógico 1: Identificação -->
        <fieldset>
          <legend>Dados de Identificação</legend>
          
          <label for="nome">Nome Completo *:</label>
          <input type="text" id="nome" name="nome" required minlength="3" placeholder="Digite seu nome completo">

          <label for="cpf">CPF *:</label>
          <input type="text" id="cpf" name="cpf" required 
                 pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" 
                 title="Digite o CPF no formato: 000.000.000-00" 
                 placeholder="000.000.000-00">
        </fieldset>

        <!-- Agrupamento Lógico 2: Contato e Localização -->
        <fieldset>
          <legend>Contato e Localização</legend>
          
          <label for="email">E-mail Institucional/Pessoal *:</label>
          <input type="email" id="email" name="email" required placeholder="seu-email@provedor.com">

          <label for="telefone">Telefone Celular *:</label>
          <input type="tel" id="telefone" name="telefone" required 
                 pattern="\(\d{2}\)\s9\d{4}-\d{4}" 
                 title="Digite o telefone no formato: (11) 99999-9999" 
                 placeholder="(11) 99999-9999">

          <label for="cep">CEP *:</label>
          <input type="text" id="cep" name="cep" required 
                 pattern="\d{5}-\d{3}" 
                 title="Digite o CEP no formato: 00000-000" 
                 placeholder="00000-000">
        </fieldset>

        <!-- Agrupamento Lógico 3: Preferências de Atuação -->
        <fieldset>
          <legend>Preferências de Apoio</legend>
          
          <label for="modalidade">Como prefere atuar? *:</label>
          <select id="modalidade" name="modalidade" required>
            <option value="">Selecione uma modalidade...</option>
            <option value="voluntario">Voluntariado Geral</option>
            <option value="doador">Doador de Recursos</option>
          </select>
        </fieldset>

        <div class="acoes-formulario">
          <button type="submit">Finalizar Cadastro</button>
        </div>

      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Nossa ONG. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
